    vehicle: segregated
    controls_flows: false
    flows: []

- key: card_8
  name: "Card 8 - The client who does not recognise their own return"
  card: "Scenario 8"
  brief: >
    A segregated account in the composite, with a large contribution in March and a withdrawal in
    September. The GIPS Composite Report the client was sent shows 8.86% gross for 2025 (Record 1).
    The lab gives this account's own time-weighted return and its money-weighted return for the same
    year. Three figures, all correct. Draft the two sentences you would send the client. Which of the
    three answers the question they are actually asking?
  config:
    preset: equity
    event_shift: 0
    v0: 250
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 15
    revalue_large: true
    window_start: 2024-12-31
    window_end: 2025-12-31
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2025-03-14, direction: Subscription, amount: 80, label: "Contribution"}
      - {date: 2025-09-19, direction: Redemption, amount: 60, label: "Withdrawal"}

- key: fees
  name: "Gross headline, net reality"
  card: "Audit variation - fee treatment"
  brief: >
    The same three-year window shown gross and then net of a 1.10% model fee accrued daily. Switch the
    basis in the sidebar. The gap between the two grows with time and with the level of returns, and
    2.A.31 sets the direction any model fee is allowed to err in.
  config:
    preset: equity
    event_shift: 0
    v0: 100
    fee: 1.10
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 10
    revalue_large: true
    window_start: 2021-12-31
    window_end: 2024-12-31
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2023-09-30, direction: Subscription, amount: 25, label: "Subscription"}

