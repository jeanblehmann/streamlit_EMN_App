# Return Sensitivity Lab - scenario presets.
# Each preset lands the pair on a configuration. Edit freely; the app reads this file at start-up.
#
# config keys
#   preset         equity | bond | private_markets | card_base
#   event_shift    months by which the record's drawdown is moved (private markets: whole quarters)
#   seg1, seg2     card_base only - return (%) up to the flow date and after it
#   v0             opening portfolio value (millions)
#   fee            management fee, % p.a. (accrued daily when basis = net)
#   basis          gross | net
#   frequency      daily | monthly | quarterly  (Modified Dietz sub-periods)
#   method         exact | dietz
#   threshold      large cash flow threshold, % of portfolio value (0 = no policy)
#   revalue_large  whether the policy is applied (false reproduces a flow left inside a sub-period)
#   window_start / window_end   presentation period (valuation dates)
#   annualise      show a sub-year figure annualised (for demonstration - it is prohibited)
#   lead_with      TWR | MWR - the figure the manager wants to headline
#   vehicle        segregated | closed_end
#   controls_flows whether the firm controls the timing of external cash flows
#   flows          list of {date, direction (Subscription|Redemption), amount, label}

- key: free_play
  name: "Free play"
  card: ""
  brief: >
    Move anything. The market path is fixed by the preset; the flows, the valuation frequency,
    the calculation method and the window are yours. Watch which figures move and which stay still.
  config:
    preset: equity
    event_shift: 0
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 10
    revalue_large: true
    window_start: 2020-12-31
    window_end: 2025-12-31
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2022-03-31, direction: Subscription, amount: 20, label: "Top-up"}
      - {date: 2024-06-30, direction: Redemption, amount: 15, label: "Partial withdrawal"}

- key: card_base
  name: "Card base case - 100 to 108 to 150, +40 at day 15"
  card: "Base case for cards 1, 2, 3 and 8"
  brief: >
    The base case printed on the scenario cards. Opening value 100, value 108 immediately before a
    +40 flow at day 15 of 30, closing value 150. Exact TWR 9.4595%, Modified Dietz 8.3333%,
    money-weighted 8.3613%. Cards 1, 2 and 3 each move one lever from here.
  config:
    preset: card_base
    seg1: 8.0
    seg2: 1.35135
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 0
    revalue_large: false
    window_start: 2025-05-31
    window_end: 2025-06-30
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2025-06-15, direction: Subscription, amount: 40, label: "Flow at day 15"}

- key: card_1
  name: "Card 1 - The flow that arrived at the wrong moment"
  card: "Scenario 1"
  brief: >
    GCC equity boutique, four portfolios in one composite, monthly valuation. The head of distribution
    has asked whether the calculation is being done the most favourable permissible way.
    Move the flow date from day 1 to day 30 with the day-shift slider, holding everything else. Record
    exact TWR and Modified Dietz at days 1, 8, 15, 22 and 30. Where is the gap widest, and why there?
    Is 'pick the most favourable permissible method' an available answer under 2.A.24(g)?
  config:
    preset: card_base
    seg1: 8.0
    seg2: 1.35135
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 0
    revalue_large: false
    window_start: 2025-05-31
    window_end: 2025-06-30
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2025-06-15, direction: Subscription, amount: 40, label: "Flow at day 15"}

- key: card_2
  name: "Card 2 - The threshold nobody has revisited"
  card: "Scenario 2"
  brief: >
    Sukuk manager, 10% large cash flow threshold set in 2019; average portfolio size has tripled since.
    Operations wants 25% to cut the number of interim valuations. Hold the flow at day 15 and change
    its size from 5 to 40 (the amount column). Below the threshold the flow sits inside the month and
    is approximated; at or above it the portfolio is revalued. At what size does the approximation
    stop being tolerable, and what is the firm actually choosing when it sets a threshold?
  config:
    preset: card_base
    seg1: 8.0
    seg2: 1.35135
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 25
    revalue_large: true
    window_start: 2025-05-31
    window_end: 2025-06-30
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2025-06-15, direction: Subscription, amount: 5, label: "Flow at day 15"}

- key: card_3
  name: "Card 3 - The market moved the other way"
  card: "Scenario 3"
  brief: >
    Concentrated equity manager, one large mid-period subscription. The performance team has told the
    CIO that Modified Dietz 'understates' returns. Keep the flow at day 15 at 40 and change the two
    segment returns in the sidebar: first make the market fall after the flow, then make it fall before
    the flow and rise after. Which way does the Dietz error run in each case? Is the claim a general
    truth, a sometimes truth, or a mistake?
  config:
    preset: card_base
    seg1: 8.0
    seg2: 1.35135
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 0
    revalue_large: false
    window_start: 2025-05-31
    window_end: 2025-06-30
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2025-06-15, direction: Subscription, amount: 40, label: "Flow at day 15"}

- key: audit_s1
  name: "Large subscription before the drawdown"
  card: "Audit scenario 1"
  brief: >
    A 50 million subscription lands two months before the market's largest drawdown. The time-weighted
    return does not see it; the money-weighted return does, because half the client's money went in at
    the top. The manager did not choose the timing. Which figure describes the manager, and which
    describes the client?
  config:
    preset: equity
    event_shift: 0
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 10
    revalue_large: true
    window_start: 2021-12-31
    window_end: 2023-12-31
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2022-02-28, direction: Subscription, amount: 50, label: "Subscription before the fall"}

- key: audit_s2
  name: "Large subscription after the drawdown"
  card: "Audit scenario 2"
  brief: >
    The same subscription, five months later, after the trough. The time-weighted return is unchanged.
    The money-weighted return is now well above it. A manager leading with the money-weighted figure
    would be claiming the timing of a flow it did not control. Try headlining MWR in the sidebar and
    read what the Standards say about the choice.
  config:
    preset: equity
    event_shift: 0
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 10
    revalue_large: true
    window_start: 2021-12-31
    window_end: 2023-12-31
    annualise: false
    lead_with: MWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2022-07-31, direction: Subscription, amount: 50, label: "Subscription after the trough"}

- key: audit_s3
  name: "Private markets - appraisal lag"
  card: "Audit scenario 3 (revisited in Session 6)"
  brief: >
    A closed-end fund marked quarterly from appraisals. The marks fall two quarters after the listed
    market did. Capital is called on the manager's schedule and distributed as investments exit. The
    firm controls the flows and the vehicle is closed-end, so 1.A.35 permits a money-weighted return.
    Compare the quarterly-linked time-weighted figure with the money-weighted one, then move the
    drawdown with the event slider and watch which statistic on a quarterly series is affected.
  config:
    preset: private_markets
    event_shift: 0
    v0: 25
    fee: 0.0
    basis: gross
    frequency: quarterly
    method: dietz
    threshold: 0
    revalue_large: false
    window_start: 2020-12-31
    window_end: 2025-12-31
    annualise: false
    lead_with: MWR
    vehicle: closed_end
    controls_flows: true
    flows:
      - {date: 2021-03-31, direction: Subscription, amount: 30, label: "Capital call"}
      - {date: 2021-09-30, direction: Subscription, amount: 25, label: "Capital call"}
      - {date: 2022-03-31, direction: Subscription, amount: 20, label: "Capital call"}
      - {date: 2022-09-30, direction: Subscription, amount: 15, label: "Capital call"}
      - {date: 2023-03-31, direction: Subscription, amount: 10, label: "Capital call"}
      - {date: 2023-12-31, direction: Redemption, amount: 15, label: "Distribution"}
      - {date: 2024-06-30, direction: Redemption, amount: 20, label: "Distribution"}
      - {date: 2024-12-31, direction: Redemption, amount: 20, label: "Distribution"}
      - {date: 2025-06-30, direction: Redemption, amount: 15, label: "Distribution"}

- key: card_4
  name: "Card 4 - The manager who controls the timing"
  card: "Scenario 4"
  brief: >
    Private markets GP, closed-end fund, vintage 2020. An LP has asked why the fund reports a
    money-weighted return when the firm's equity composites report time-weighted returns. Hold the
    investment outcomes constant (the path) and move only the dates on which capital was called and
    distributed, with the month-shift slider or by editing dates. Which measure moves and which stays
    still - and why is that the right way round? What does 1.A.35 require before the fund may present
    a money-weighted return at all?
  config:
    preset: private_markets
    event_shift: 0
    v0: 25
    fee: 0.0
    basis: gross
    frequency: quarterly
    method: dietz
    threshold: 0
    revalue_large: false
    window_start: 2020-12-31
    window_end: 2025-12-31
    annualise: false
    lead_with: MWR
    vehicle: closed_end
    controls_flows: true
    flows:
      - {date: 2021-03-31, direction: Subscription, amount: 30, label: "Capital call"}
      - {date: 2021-09-30, direction: Subscription, amount: 25, label: "Capital call"}
      - {date: 2022-03-31, direction: Subscription, amount: 20, label: "Capital call"}
      - {date: 2022-09-30, direction: Subscription, amount: 15, label: "Capital call"}
      - {date: 2023-03-31, direction: Subscription, amount: 10, label: "Capital call"}
      - {date: 2023-12-31, direction: Redemption, amount: 15, label: "Distribution"}
      - {date: 2024-06-30, direction: Redemption, amount: 20, label: "Distribution"}
      - {date: 2024-12-31, direction: Redemption, amount: 20, label: "Distribution"}
      - {date: 2025-06-30, direction: Redemption, amount: 15, label: "Distribution"}

- key: audit_s4
  name: "The window that misses the drawdown"
  card: "Audit scenario 4"
  brief: >
    Both figures look strong. The flows and the method are in order: the presentation period
    opens three months after the trough. Move the window start back across the drawdown and watch the
    headline. Then decide which of the 8.C.1 patterns this window fits, and what 8.A.13 lets a firm
    do with a period that fits none of them.
  config:
    preset: equity
    event_shift: 0
    v0: 100
    fee: 0.0
    basis: gross
    frequency: monthly
    method: dietz
    threshold: 10
    revalue_large: true
    window_start: 2022-09-30
    window_end: 2025-12-31
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2023-06-30, direction: Subscription, amount: 30, label: "Subscription"}

