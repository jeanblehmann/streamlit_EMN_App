  brief: >
    A listed-equity portfolio valued quarterly, with flows landing inside the quarters. Compare the
    quarterly-linked Modified Dietz with the exact figure, then read 2.A.23 and 2.A.24 on the floor for
    valuation and calculation frequency. Then switch to monthly and see what the floor buys.
  config:
    preset: equity
    event_shift: 0
    v0: 100
    fee: 0.0
    basis: gross
    frequency: quarterly
    method: dietz
    threshold: 0
    revalue_large: false
    window_start: 2021-12-31
    window_end: 2023-12-31
    annualise: false
    lead_with: TWR
    vehicle: segregated
    controls_flows: false
    flows:
      - {date: 2022-05-12, direction: Subscription, amount: 30, label: "Subscription mid-quarter"}
      - {date: 2022-11-08, direction: Redemption, amount: 20, label: "Withdrawal mid-quarter"}
      - {date: 2023-08-15, direction: Subscription, amount: 15, label: "Subscription mid-quarter"}
